name: Web MVP

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the web image
        run: docker build -f Dockerfile.web -t downloader-web .
      - name: Test format selection and the production HTTP flow
        run: |
          docker run --rm --network none --entrypoint /opt/media/bin/python \
            --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" \
            downloader-web -m unittest discover -s tests
          docker run --rm --network none --entrypoint /opt/media/bin/python \
            --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" \
            downloader-web tests/check_http.py
