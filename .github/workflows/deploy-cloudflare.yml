name: Deploy Downloader

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-cloudflare.yml
      - cloudflare.config.ts

permissions:
  contents: read

concurrency:
  group: downloader-cloudflare-beta-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - name: Check that deployment credentials are configured
        working-directory: .
        env:
          DEPLOY_CREDENTIALS_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [[ "$DEPLOY_CREDENTIALS_CONFIGURED" != 'true' ]]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm run typecheck && npm test
      - name: Build Worker and container
        run: npm run build:cloudflare
      - name: Deploy the verified build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:cloudflare
      - name: Verify the public home page
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 6 --max-time 15 \
            https://downloader.angder.app/ --output "$RUNNER_TEMP/downloader-home.html"
          grep -q 'Save a Facebook video' "$RUNNER_TEMP/downloader-home.html"
      - name: Verify the public inspection API
        run: |
          status=$(curl --silent --show-error --max-time 15 --write-out '%{http_code}' \
            --output "$RUNNER_TEMP/downloader-invalid-link.json" --header 'Content-Type: application/json' \
            --data '{"url":"https://example.com/video"}' https://downloader.angder.app/api/videos/inspect)
          test "$status" = 400
          node -e 'if (require(process.argv[1]).data?.code !== "INVALID_LINK") process.exit(1)' "$RUNNER_TEMP/downloader-invalid-link.json"
