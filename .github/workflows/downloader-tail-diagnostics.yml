name: Verify container idle lifecycle
on:
  push:
    branches: [codex/downloader-tail-diagnostics]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Measure Downloader instance state without waking it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'EOF'
          import {setTimeout as delay} from 'node:timers/promises'
          const account='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}
          async function query(path){
            const r=await fetch(account+path,{headers,signal:AbortSignal.timeout(12000)})
            if(!r.ok)return {http:r.status}
            const data=await r.json()
            return data.result??data
          }
          const apps=await query('/containers/applications')
          const app=(Array.isArray(apps)?apps:apps.applications??[]).find(a=>a.name==='downloader-beta')
          if(!app){console.log('Application lookup',apps.http??null,Object.keys(apps));process.exit(1)}
          const path='/containers/applications/'+app.id
          const versions=await query(path+'/versions')
          console.log('Rollout',JSON.stringify(Array.isArray(versions)?versions.map(v=>Object.fromEntries(Object.entries(v).filter(([k,val])=>/(status|rollout|version|active|created)/i.test(k)&&['string','number','boolean'].includes(typeof val)))):versions.http??Object.keys(versions)))
          console.log('Application image',app.configuration?.image?.split('@').at(-1))
          for(let step=0;step<1;step++){
            const result=await query(path+'/instances-v2')
            const placements=Array.isArray(result)?result:result.instances??result.placements??[]
            const states=placements.map(item=>item.status && ({state:item.status.state,since:item.status.updated_at}))
            const raw=placements.map(item=>Object.fromEntries(Object.entries(item).filter(([k,v])=>/status|version|created|updated|image/i.test(k)&&typeof v==='string').map(([k,v])=>[k,v.includes('@')?v.split('@').at(-1):v])))
            console.log(new Date().toISOString(),JSON.stringify({count:placements.length,states,raw,keys:Object.keys(result).slice(0,12),http:result.http}))
          }
          EOF
