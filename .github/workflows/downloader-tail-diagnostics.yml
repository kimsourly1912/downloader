name: Diagnose live inspection
on:
  push:
    branches: [codex/downloader-tail-diagnostics]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Record live inspection error categories
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'EOF'
          import {once} from 'node:events'
          import {setTimeout as delay} from 'node:timers/promises'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/downloader-beta/tails'
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'}
          const response=await fetch(base,{method:'POST',headers,body:'{}'})
          if(!response.ok){console.log('Tail creation HTTP',response.status);process.exit(1)}
          const {result}=await response.json()
          const ws=new WebSocket(result.url,'trace-v1')
          ws.addEventListener('message',async ({data})=>{
            const parsed=JSON.parse(typeof data==='string'?data:await data.text())
            for(const entry of Array.isArray(parsed)?parsed:[parsed]){
              if(!entry.event?.request?.url?.endsWith('/api/videos/inspect')&&!(entry.exceptions??[]).length)continue
              const redact=text=>String(text??'').replace(/https?:[^\s]+/g,'[URL]').slice(0,240)
              console.log(JSON.stringify({outcome:entry.outcome,exceptions:(entry.exceptions??[]).map(e=>({name:e.name,message:redact(e.message)})),logs:(entry.logs??[]).filter(l=>l.level==='error').map(l=>l.message.map(redact))}))
            }
          })
          try{
            await Promise.race([once(ws,'open'),delay(4500).then(()=>{throw Error('Tail session did not open')})])
            const result=await fetch('https://downloader.angder.app/api/videos/inspect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:'https://www.facebook.com/reel/1195289147628387/'}),signal:AbortSignal.timeout(55000)})
            console.log('Inspection HTTP',result.status)
            await result.body?.cancel()
            await delay(4000)
          }finally{
            ws.close()
            await fetch(base+'/'+result.id,{method:'DELETE',headers})
          }
          EOF
