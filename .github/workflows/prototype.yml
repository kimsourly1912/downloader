name: Docker prototype

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Docker image
        run: docker build -t downloader-prototype .
      - name: Check the bundled extractor
        run: docker run --rm --network none --entrypoint python downloader-prototype -m yt_dlp --version
      - name: Verify combined and separate audio and video tracks
        run: docker run --rm -i --network none --entrypoint python downloader-prototype - < scripts/check_prototype.py
