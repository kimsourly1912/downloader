name: Deploy Facebook Worker probe

on:
  push:
    branches: [codex/facebook-worker-probe]
    paths:
      - 'cloudflare/facebook-probe/**'
      - '.github/workflows/facebook-worker-probe.yml'
      - 'tests/facebook-probe.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downloader-facebook-worker-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/codex/facebook-worker-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/facebook-probe.test.mjs && npx tsc -p cloudflare/tsconfig.json
      - name: Build the isolated Worker
        working-directory: cloudflare/facebook-probe
        run: ../../node_modules/.bin/vite build --mode production
      - name: Deploy the isolated Worker
        working-directory: cloudflare/facebook-probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../../node_modules/.bin/cf deploy --prebuilt --mode production
      - name: Verify the probe rejects public requests
        run: |
          for attempt in {1..8}; do
            status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' \
              https://downloader-worker-preview.angder.app/probe) || true
            if [[ "$status" == 404 ]]; then exit 0; fi
            sleep 4
          done
          exit 1
